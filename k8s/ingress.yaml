apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazrah-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: bazrah.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: bazrah-api
            port:
              number: 3000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bazrah-frontend
            port:
              number: 80
