apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazrah-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bazrah-frontend
  template:
    metadata:
      labels:
        app: bazrah-frontend
    spec:
      containers:
      - name: bazrah-frontend
        image: bazrah/frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bazrah-frontend
spec:
  ports:
  - port: 80
  selector:
    app: bazrah-frontend
