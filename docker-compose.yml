version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bazrah_postgres
    environment:
      POSTGRES_DB: bazrahdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bazrah_network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: bazrah_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bazrah_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  bazrah_network:
    driver: bridge
